{{- /*
  The ServiceAccount that the postgres-init subchart created when the release was first
  installed. postgres-init is disabled now (the connector database already exists), so the
  subchart no longer renders it, but the running release still owns it. Keeping it here
  stops a Helm upgrade from deleting it; it is byte-for-byte what the release renders today.
  When postgres-init is enabled the subchart renders the same object, so this template steps aside.
*/ -}}
{{- if not (index .Values "postgres-init" "enabled") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations: {}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: postgres-init
    helm.sh/chart: postgres-init-0.0.0-develop
  name: {{ .Release.Name }}-postgres-init
{{- end }}
