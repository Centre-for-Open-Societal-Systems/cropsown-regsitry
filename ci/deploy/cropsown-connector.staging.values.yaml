# Release values of the staging cropsown-connector release (namespace crop), applied by
# ci/deploy/upgrade-crop-connector-staging.sh with `helm upgrade --atomic --reset-values`.
# Taken from `helm get values cropsown-connector` at revision 2 (2026-10-08); database, hosts, Secret
# names and the ODK address are unchanged. No secret values: the database password stays in the
# existing Secret cropsown-connector. The images are not here: the staging pipeline writes them, by
# digest, from the build of the registry it just promoted.
fullnameOverride: cropsown-connector

global:
  hostname: connector-cropsown-registry.crop.staging.openg2p.test
  postgresqlHost: commons-postgresql.commons.svc.cluster.local
  postgresqlPort: 5432
  redisHost: cropsown-registry-redis-master
  redisPort: 6379
  partnerApiService: cropsown-registry-partner-api
  connectorDB: cropsown_connector_crop
  connectorDBUser: crop_cropsown_connector_user
  connectorDBSecret: cropsown-connector
  connectorDBUserPasswordKey: cropsown-connector-db-user

imagePullSecrets:
  - name: ecr-pull-secret

commonEnv:
  CONNECTOR_CORS_ORIGINS: https://connector-cropsown-registry.crop.staging.openg2p.test

# The image bakes the New Dev admin-auth issuer (docker/registry-connector/admin-auth.json). Staging
# tokens come from keycloak.qa.oanstaging.com, so the API must expect that issuer, or every admin call
# (the definitions hook included) is 401 "Invalid issuer". Same values as the staging Farmer connector.
#
# Farmer-reference receivers (WebSub topics oan.farmer-reference.changed.v1 and
# farmer-registry.farmer-profile.changed.v1): the connector signs the registry payload with the staging
# crop lookup key, as the livestock connector does. Without a key every delivery goes to the dead-letter
# queue as "Registry signature is not configured", and the registry never gets a Farmer reference. The
# key stays in the Secret crop-farmer-lookup-signing-ed25519 (key private-key.pem); the kid is that
# Secret's kid. Once a key resolves, the beat task connector.oan_redrive_unsigned replays those entries.
extraEnv:
  CONNECTOR_ODK_CENTRAL_BASE_URL: https://odk-central.qa.oanstaging.com
  CONNECTOR_ADMIN_AUTH_ISSUER: https://keycloak.qa.oanstaging.com/realms/staff
  CONNECTOR_ADMIN_AUTH_JWKS_URL: http://commons-keycloak.commons.svc.cluster.local:80/realms/staff/protocol/openid-connect/certs
  CONNECTOR_SIGNING_KID: crop-lookup-ed25519-3a077466c8436fc2
extraEnvFrom:
  CONNECTOR_SIGNING_KEY_PEM:
    secretKeyRef:
      name: crop-farmer-lookup-signing-ed25519
      key: private-key.pem
      optional: false

api:
  image:
    pullPolicy: IfNotPresent
worker:
  image:
    pullPolicy: IfNotPresent
beat:
  image:
    pullPolicy: IfNotPresent
ui:
  image:
    pullPolicy: IfNotPresent

istio:
  enabled: true
  gateway:
    create: false
    name: internal
  virtualservice:
    enabled: true
    gateway: internal

# The connector database and user exist since the first install. With the init enabled, the chart's
# pre-upgrade hooks would run again against the Secret that holds the database password; the
# chart's preserved-init-serviceaccount.yaml keeps the ServiceAccount the release still owns.
postgres-init:
  enabled: false
