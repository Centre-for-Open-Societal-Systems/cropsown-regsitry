name: Checks

# Fast, Docker-free checks that gate a change before the build. Currently: the
# openg2p-registry pin must stay in lockstep across the Dockerfiles and the Helm
# chart dependency (test/test_rp_pin_lockstep.py). Runs in parallel with
# build-publish.yml; a split pin shows red in seconds instead of surfacing as a
# broken sanity image three deploys later.

on:
  push:
    branches: ["**", "!dependabot/**"]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pytest "sqlalchemy[asyncio]>=2" aiosqlite PyYAML httpx PyJWT cryptography orjson
      - name: openg2p-registry pin lockstep
        run: python -m pytest test/test_rp_pin_lockstep.py -q
      - name: schema sync adds new model columns to existing tables
        run: python -m pytest test/test_schema_sync.py -q
      - name: Routing guard and staging value preservation
        run: python -m pytest test/test_new_dev_routes.py test/test_staging_values_preservation.py -q
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - name: Resolve pinned chart dependency
        run: |
          helm repo add openg2p https://openg2p.github.io/openg2p-helm
          helm dependency build helm/openg2p-cropsown-registry
      - name: Render isolated dev and staging routing profiles
        run: python -m pytest test/test_chart_environments.py -q
      - name: Farmer enrichment configuration and startup wiring
        run: python -m pytest test/test_farmer_enrichment.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run real lookup client against DCI failure simulation
        shell: bash
        run: |
          npm install --global postman-cli@1.73.0
          postman simulation run postman/simulations/farmer-enrichment.sim.yaml --port 49180 --output ndjson > /tmp/crop-dci-simulation.ndjson 2>/tmp/crop-dci-simulation.err &
          trap 'pkill -INT -f "postman simulation run postman/simulations/farmer-enrichment.sim.yaml" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:49180/farmer/success; then break; fi
            sleep 1
          done
          CROP_FARMER_SIMULATION_URL=http://127.0.0.1:49180/farmer python -m pytest test/test_farmer_enrichment_http.py -q
      - name: Dashboard deployment stash and digest label regressions
        run: python -m pytest test/test_dashboard_delivery.py -q
      - name: Connector WebSub security and pipeline regressions
        env:
          CONNECTOR_CELERY_BROKER_URL: memory://
          CONNECTOR_CELERY_RESULT_BACKEND: cache+memory://
        run: |
          pip install --quiet -e './openg2p-connector-service[dev]'
          cd openg2p-connector-service
          python -m pytest tests -q
