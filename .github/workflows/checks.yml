name: Checks

# Fast, Docker-free checks that gate a change before the build. Currently: the
# openg2p-registry pin must stay in lockstep across the Dockerfiles and the Helm
# chart dependency (test/test_rp_pin_lockstep.py). Runs in parallel with
# build-publish.yml; a split pin shows red in seconds instead of surfacing as a
# broken sanity image three deploys later.

on:
  push:
    branches: ["**", "!dependabot/**"]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pytest "sqlalchemy[asyncio]>=2" aiosqlite PyYAML
      - name: openg2p-registry pin lockstep
        run: python -m pytest test/test_rp_pin_lockstep.py -q
      - name: schema sync adds new model columns to existing tables
        run: python -m pytest test/test_schema_sync.py -q
      - name: Routing guard and staging value preservation
        run: python -m pytest test/test_new_dev_routes.py test/test_staging_values_preservation.py -q
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - name: Resolve pinned chart dependency
        run: |
          helm repo add openg2p https://openg2p.github.io/openg2p-helm
          helm dependency build helm/openg2p-cropsown-registry
      - name: Render isolated dev and staging routing profiles
        run: python -m pytest test/test_chart_environments.py -q
      - name: Farmer enrichment configuration and startup wiring
        run: python -m pytest test/test_farmer_enrichment.py -q
      - name: Dashboard deployment stash and digest label regressions
        run: python -m pytest test/test_dashboard_delivery.py -q
