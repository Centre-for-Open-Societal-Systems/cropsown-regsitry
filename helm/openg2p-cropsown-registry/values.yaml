# Farmer reference: signed DCI lookup of the source Farmer, Farmer updates through
# outgestion (Kafka/WebSub) and the Crop connector, AWE delivery. Enabled per
# environment; see README "Farmer reference" for the Secrets and the env/mounts.
farmerReference:
  enabled: false
  # PEM public key the Farmer partner API signs its DCI responses with. The
  # openg2p-farmer-registry chart's dciSigning hook publishes it in ConfigMap
  # <farmer release>-dci-signing-public (key public-key.pem) and in its log.
  sourcePublicKey: ''
  # Server-owned mapping of the signed Farmer record onto Crop's local fields
  # (RecordContract in the extension). Not a client trust setting.
  recordContract:
    source_id: farmer_reference.farmer_id
    farmer_id: farmer_reference.farmer_id
    uid: farmer_reference.fan
    fin: farmer_reference.fin
    approved_at: farmer_reference.approved_at
    status: farmer_reference.record_status
    source_query_field: functional_record_id
    uid_query_field: foundational_id
    fin_query_field: foundational_id
    # The farmer's photo as bytes with its SHA-256; stored in this registry's
    # own document store.
    photo: farmer_reference.photo
    profile_paths:
      first_name: farmer_reference.first_name
      middle_name: farmer_reference.middle_name
      last_name: farmer_reference.last_name
      first_name_amh: farmer_reference.first_name_amh
      middle_name_amh: farmer_reference.middle_name_amh
      last_name_amh: farmer_reference.last_name_amh
      gender: farmer_reference.gender
      birth_date: farmer_reference.birth_date
      mobile_number: farmer_reference.mobile_number
      address_line_1: farmer_reference.address_line_1
      address_line_2: farmer_reference.address_line_2
      postal_code: farmer_reference.postal_code
      country_code: farmer_reference.country_code
      geo_lowest_level_value_id: farmer_reference.geo_lowest_level_value_id
      geo_code_hierarchy_json: farmer_reference.geo_code_hierarchy_json
      region_id: farmer_reference.region_id
      zone_id: farmer_reference.zone_id
      woreda_id: farmer_reference.woreda_id
      kebele_id: farmer_reference.kebele_id
      region_name: farmer_reference.region_name
      zone_name: farmer_reference.zone_name
      woreda_name: farmer_reference.woreda_name
      kebele_name: farmer_reference.kebele_name
      # The rest of the Farmer tab (not the Fayda verification, documents or staff names).
      first_name_other: farmer_reference.first_name_other
      middle_name_other: farmer_reference.middle_name_other
      last_name_other: farmer_reference.last_name_other
      language_spoken: farmer_reference.language_spoken
      has_national_id: farmer_reference.has_national_id
      rid: farmer_reference.rid
      odk_farmer_id: farmer_reference.odk_farmer_id
      pula_id: farmer_reference.pula_id
      birth_date_ec: farmer_reference.birth_date_ec
      estimated_age: farmer_reference.estimated_age
      marital_status: farmer_reference.marital_status
      education_level: farmer_reference.education_level
      disabled: farmer_reference.disabled
      disability_type: farmer_reference.disability_type
      disability_severity: farmer_reference.disability_severity
      source_of_income: farmer_reference.source_of_income
      source_of_income_other: farmer_reference.source_of_income_other
      income_sources: farmer_reference.income_sources
      is_psnp_user: farmer_reference.is_psnp_user
      is_farmer: farmer_reference.is_farmer
      farming_type: farmer_reference.farming_type
      phones: farmer_reference.phones
      email: farmer_reference.email
      plus_code: farmer_reference.plus_code
      latitude: farmer_reference.latitude
      longitude: farmer_reference.longitude
      altitude: farmer_reference.altitude

# Pull secret for the ECR images, created before install/upgrade by a hook Job
# and refreshed by a CronJob from the node's IAM role (ECR tokens last 12 h).
# Pods use it through the ServiceAccounts named in serviceAccounts, which the
# job patches to list the secret (the openg2p-registry subchart pods and seed
# jobs run as "default"). global.imagePullSecrets is not used for this: with
# the pinned subchart it renders invalid Deployment YAML.
ecrPullSecret:
  enabled: false
  name: ""                 # default: <release>-ecr-pull-secret
  registry: ""             # required when enabled: <account>.dkr.ecr.<region>.amazonaws.com
  serviceAccounts: []      # ServiceAccounts to patch with the secret, e.g. [default]
  schedule: "0 */6 * * *"
  awsCliImage: amazon/aws-cli:2.36.43
  kubectlImage: alpine/k8s:1.31.1

# Sample approvers sign in with registry.global.aweApproverUserPassword (the platform default, `pass`).
# keycloak-init creates them with it as a temporary password and never updates an existing user; this
# post-install/upgrade hook makes it the permanent password for the users listed here
# (templates/sample-approver-password.yaml). An empty aweApproverUserPassword turns it off.
sampleApproverPassword:
  enabled: true
  realm: staff
  users:
    - alex.carter
    - nina.patel
  image: python:3.11.14-slim
  imagePullSecrets: []
  waitSeconds: 600
