  openg2p.org/add-to-rancher: ''
  oan.org/owner: OpenAgriNet (OAN)
  oan.org/application-source: https://github.com/Centre-for-Open-Societal-Systems/cropsown-regsitry
  oan.org/chart-source: https://github.com/Centre-for-Open-Societal-Systems/cropsown-regsitry/tree/develop/helm/openg2p-cropsown-registry
  org.opencontainers.image.source: https://github.com/Centre-for-Open-Societal-Systems/cropsown-regsitry
  oan.org/promotion-ready: 'true'
