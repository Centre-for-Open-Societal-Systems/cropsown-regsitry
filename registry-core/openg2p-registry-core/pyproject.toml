[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openg2p-registry-core"
authors = [
  { name="OpenG2P", email="info@openg2p.org" },
]
description = "OpenG2P Registry Core"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Operating System :: OS Independent",
]
dependencies = [
  "openg2p-fastapi-common >= 1.1.3",
  "jsonpath_ng",
  "asyncpg",
  "jinja2",
  "minio",
  "pyld",
  "uuid",
  "fastapi-cache2",
  "cryptography",
  "redis"
]
dynamic = ["version"]

[project.urls]
Homepage = "https://openg2p.org"
Documentation = "https://docs.openg2p.org/"
Repository = "https://github.com/OpenG2P/openg2p-registry-gen2-core"
Source = "https://github.com/OpenG2P/openg2p-registry-gen2-core"

[tool.hatch.version]
path = "src/openg2p_registry_core/__init__.py"
